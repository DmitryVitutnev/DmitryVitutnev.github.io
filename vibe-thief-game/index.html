<canvas id=canvas aria-label="LLLOOOT stealth game" tabindex=0></canvas>
<div id=modalDialog class=modal role=dialog aria-modal=true aria-label="Game result">
  <div class=modal-content>
    <p id=modalText style=white-space:pre-wrap></p>
    <button id=modalCloseButton>Close</button>
  </div>
</div>
<dialog id=levelEditor aria-labelledby=editorHeading>
  <header class=editor-header>
    <h1 id=editorHeading>Level editor</h1>
    <button type=button id=editorClose>Main menu</button>
  </header>
  <div class=editor-file>
    <label>Level name <input id=editorTitle maxlength=60 required></label>
    <label>Theme <select id=editorTheme></select></label>
    <div class=editor-file-actions>
      <button type=button id=editorNew>New</button>
      <button type=button id=editorOpen>Open file</button>
      <button type=button id=editorSave>Save file</button>
      <button type=button id=editorPlay class=editor-primary>Playtest</button>
      <input type=file id=editorFile accept=.json,application/json hidden>
    </div>
  </div>
  <div class=editor-floor>
    <label>Floor <select id=editorFloor></select></label>
    <label>Width <input id=editorWidth type=number inputmode=numeric></label>
    <label>Height <input id=editorHeight type=number inputmode=numeric></label>
    <label>Grid zoom
      <select id=editorZoom>
        <option value=fit>Fit width</option>
        <option value=100>100%</option>
        <option value=150>150%</option>
      </select>
    </label>
    <button type=button id=editorResize title="Resize from the top and right edges">Resize</button>
    <button type=button id=editorRemoveFloor>Remove floor</button>
  </div>
  <div class=editor-workspace>
    <div class=editor-tools>
      <label>Tool <select id=editorTool></select></label>
      <label id=editorTerrainRow>Terrain <select id=editorTerrain></select></label>
      <label id=editorItemRow>Item <select id=editorItem></select></label>
      <label id=editorStairsRow>Connect to <select id=editorDestination></select></label>
      <div id=editorGuardRow>
        <label>Guard <select id=editorGuard></select></label>
        <label class=editor-check><input type=checkbox id=editorTorch> Carries a torch</label>
        <label class=editor-check><input type=checkbox id=editorPurse> Carries loot</label>
        <button type=button id=editorRemoveGuard>Remove guard</button>
      </div>
      <div class=editor-history>
        <button type=button id=editorUndo>Undo</button>
        <button type=button id=editorRedo>Redo</button>
      </div>
      <p id=editorGuide></p>
    </div>
    <div class=editor-map>
      <canvas id=editorGrid tabindex=0 aria-label="Level grid" aria-describedby=editorGridHelp></canvas>
    </div>
  </div>
  <footer class=editor-footer>
    <span id=editorGridHelp>Use the arrow keys to select a tile and Space to apply the tool.</span>
    <span id=editorCoordinates aria-live=polite></span>
  </footer>
  <div id=editorStatus role=status></div>
</dialog>
<div id=playtestBar aria-label="Playtest controls" hidden>
  <strong id=playtestName></strong>
  <button type=button id=playtestRetry>Retry</button>
  <button type=button id=playtestBack>Back to editor</button>
</div>
