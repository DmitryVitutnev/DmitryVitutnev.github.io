<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elemental Path · Sprite workshop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111c2b;color:#e1e7df;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}header{padding:22px 28px;border-bottom:1px solid #384658;background:#192638;position:sticky;top:0;z-index:2}h1{margin:0;font-size:23px}p{color:#aab8bf;margin:5px 0 12px}nav{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit;color:inherit;background:#2c4051;border:1px solid #506473;padding:7px 12px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#5b8279;color:#fff}main{padding:20px 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}.sprite{background:#192638;border:1px solid #3c4c5d;padding:14px}.sprite h2{font-size:13px;margin:0 0 8px;min-height:20px}.canvases{display:flex;align-items:flex-end;gap:14px;justify-content:center;min-height:210px}.sample{text-align:center}.sample small{display:block;color:#99acb3;padding:5px}img{image-rendering:auto;object-fit:contain;display:block;background-color:#263c50;background-image:conic-gradient(#31485b 25%,transparent 0 50%,#31485b 0 75%,transparent 0);background-size:16px 16px}.large{width:192px;height:192px}.native{width:32px;height:32px}.light img{background-color:#e9e1cb;background-image:conic-gradient(#d4ceb8 25%,transparent 0 50%,#d4ceb8 0 75%,transparent 0)}.before{display:none}.compare .before{display:block}.compare .large{width:128px;height:128px}.compare .canvases{min-height:150px}.meta{margin:10px 0 0;color:#91a6af;font-size:11px}.pose-strip{display:flex;gap:6px;align-items:center}.count{color:#d0bd8a}@media(max-width:600px){header,main{padding:16px}.grid{grid-template-columns:1fr}.large{width:192px;height:192px}}
</style></head><body><header><h1>Sprite workshop <span class="count" id="count"></span></h1><p>All 30 comic world and interface assets at their gameplay footprint and enlarged for review. Use the character workshop to inspect the current male character.</p><nav id="filters"><button data-group="all">All sprites</button><button data-group="world" aria-pressed="true">World</button><button data-group="icons">Icons</button><button id="background" aria-pressed="false">Light background</button><button id="compare" aria-pressed="false" hidden>Compare before</button><a href="/characters.html">Current character</a><a href="/">Play game</a></nav></header><main><div class="grid" id="grid"></div></main><script type="module">
const names=(await(await fetch('/assets/manifest.json')).json()).filter(n=>!n.startsWith('player-'));const art=await(await fetch('/assets/art-manifest.json')).json();const comic=new Map(art.assets.map(a=>[a.name,a]));let group=new URLSearchParams(location.search).get('group')||'world';let comparison=false;const version=Date.now();const compare=new URLSearchParams(location.search).has('compare');
const category=n=>n.startsWith('icon-')?'icons':n.endsWith('-prepare')?'prepare':n.endsWith('-cast')?'cast':n.startsWith('player-')?'ready':'world';
function draw(){const list=names.filter(n=>group==='all'||category(n)===group);document.querySelector('#count').textContent=list.length+' / '+names.length;document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===group)));document.querySelector('#grid').innerHTML=list.map(n=>`<article class="sprite" data-sprite="${n}"><h2>${n}</h2><div class="canvases">${comparison?`<div class="sample before"><img class="large" src="/artifacts/sprite-review/before/${n}.png" alt="Previous ${n}"><small>Previous</small></div>`:""}<div class="sample"><img class="large" src="/assets/${n}.png?v=${version}" alt="${n} enlarged"><small>${comparison?"Enlarged":"6× logical"}</small></div><div class="sample"><img class="native" src="/assets/${n}.png?v=${version}" alt="${n} native"><small>32 logical px</small></div></div><div class="meta">${comic.has(n)?comic.get(n).size.join(" × ")+" · comic PNG · smooth sampling":"32 × 32 · archived pixel pose"}</div></article>`).join('');}
document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;history.replaceState(null,'','?group='+group+(compare?'&compare=1':''));draw()});document.querySelector('#background').onclick=e=>{document.body.classList.toggle('light');e.target.setAttribute('aria-pressed',String(document.body.classList.contains('light')))};if(compare)document.querySelector('#compare').hidden=false;document.querySelector('#compare').onclick=e=>{comparison=!comparison;document.body.classList.toggle('compare',comparison);e.target.setAttribute('aria-pressed',String(comparison));draw()};draw();
</script></body></html>
